services:
  postgres:
    image: postgres:16-alpine
    container_name: finaco-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finaco}
      POSTGRES_USER: ${POSTGRES_USER:-finaco}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finaco_local_only}
    ports:
      - "5432:5432"
    volumes:
      - finaco-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finaco} -d ${POSTGRES_DB:-finaco}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  finaco-postgres-data:

